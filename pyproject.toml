[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lakewatch"
version = "0.1.0"
description = "Reproducible Sentinel-2 water-window monitoring with explicit observation gaps"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "rasterio>=1.4,<2", "shapely>=2,<3", "pyproj>=3.6,<4", "requests>=2.32,<3", "pillow>=11,<14"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
lakewatch = "lakewatch.pipeline:main"
[tool.setuptools.packages.find]
include = ["lakewatch*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
